# Curated MCP overrides — the highest-trust records in this index.
#
# Every entry here was written and checked by a human against the provider's
# own documentation, so a crawl may add facts to one of these records but may
# never overwrite a field this file sets. ``dedupe.apply_curated`` overlays
# these fields after the merge and names each one in ``curated_fields``, and
# ``dedupe.elect_trust_tier`` puts every key below in the ``curated`` tier.
#
# The fifty records are Jhin's shipped connector catalog, ported field for
# field: each ``auth_note`` says what the provider actually accepts, each
# ``setup_note`` says what a person has to do before the connection will work,
# and ``url_unverified`` marks an endpoint nobody has completed a handshake
# against. Those four judgements are the whole point of the file — a crawler
# can find an endpoint but cannot tell you that Linear's remote server speaks
# OAuth and Jhin does not, or that Tavily wants its key in the URL.
#
# ``key`` is a canonical or alias key from section 2.1 of the build
# specification. It is a ``url`` key when the provider publishes a concrete
# endpoint, a ``repo`` key (with ``#subpath`` inside a monorepo) when it does
# not, and ``mcp:registry:dev.jhin/<slug>`` for the records that describe a
# Jhin-native connector rather than any published server. A key matching no
# crawled entry creates one from ``fields`` alone, which is how the
# self-hosted and native records reach the catalog at all.
#
# ``fields`` holds a partial ``McpEntry``: every name must be a settable field
# on the model, ``category`` must come from ``CATALOG_CATEGORIES``, ``icon``
# from ``CATALOG_ICONS``, and ``connector_type`` from ``CONNECTOR_TYPES``.
# ``tests/test_curated.py`` enforces all of that plus the connector_config
# bounds, so a typo here fails CI rather than the nightly sync.

